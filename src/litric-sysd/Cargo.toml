[package]
name        = "litric-sysd"
description = "LitricOS system daemon: the first LitricOS code that runs inside the OS"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[lints]
workspace = true

[dependencies]
litric-core     = { path = "../litric-core" }
litric-caps     = { path = "../litric-caps" }
litric-defender = { path = "../litric-defender" }
litric-env      = { path = "../litric-env" }
litric-storage  = { path = "../litric-storage" }
litric-trash    = { path = "../litric-trash" }
litric-update   = { path = "../litric-update" }

[lib]
name = "litric_sysd"
path = "src/lib.rs"

[[bin]]
name = "litric-sysd"
path = "src/main.rs"

# The execution half of the application path. It is in this package because it
# reuses the broker's store formatting and compatibility resolver verbatim: a
# second copy of either would be a second answer to the same question.
[[bin]]
name = "litric-appd"
path = "src/bin/litric-appd.rs"
