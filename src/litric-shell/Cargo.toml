[package]
name        = "litric-shell"
description = "LitricOS shell: the desktop that appears at boot"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[lints]
workspace = true

[dependencies]
litric-design = { path = "../litric-design" }
litric-sysd   = { path = "../litric-sysd" }
litric-notifyd = { path = "../litric-notifyd" }
litric-input  = { path = "../litric-input" }
litric-wm     = { path = "../litric-wm" }
litric-locale = { path = "../litric-locale" }
litric-files  = { path = "../litric-files" }
litric-defender = { path = "../litric-defender" }
litric-compositor = { path = "../litric-compositor" }
litric-core = { path = "../litric-core" }
litric-text = { path = "../litric-text" }
png = "0.18.1"

[lib]
name = "litric_shell"
path = "src/lib.rs"

[[bin]]
name = "litric-shell"
path = "src/main.rs"
