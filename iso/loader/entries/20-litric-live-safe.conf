title    LitricOS @VERSION@ (live, basic graphics)
sort-key 20
efi      /EFI/Linux/litricos-@VERSION@.efi
# Phase 11 failure mode: "no display on boot (GPU driver) -> the image must
# always ship a nomodeset/basic-framebuffer boot entry." This is that entry.
# litric.shell=software forces the compositor onto llvmpipe rather than letting
# it fail to find a DRM device and exit.
options  nomodeset litric.shell=software litric.live=1 litric.volid=@VOLID@ roothash=@ROOTHASH@ systemd.verity=yes
