title    LitricOS @VERSION@ (recovery console)
sort-key 40
efi      /EFI/Linux/litricos-@VERSION@.efi
# Boots litric-recovery.target: shell, storage tools, network, log extraction.
# No compositor, no AI, no defender. Persistent journald so that whatever went
# wrong is still readable after the next reboot.
options  systemd.unit=litric-recovery.target systemd.journald.storage=persistent litric.live=1 litric.volid=@VOLID@ roothash=@ROOTHASH@ systemd.verity=yes
