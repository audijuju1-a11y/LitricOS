title    LitricOS @VERSION@ (live, defender off)
sort-key 30
efi      /EFI/Linux/litricos-@VERSION@.efi
# Phase 07 failure mode: a false positive that blocks a system binary must have
# an escape hatch that does not require another machine to fix.
options  litric.defender=off litric.live=1 litric.volid=@VOLID@ roothash=@ROOTHASH@ systemd.verity=yes
