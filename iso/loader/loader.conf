# systemd-boot configuration for the LitricOS live ISO.
default  litric-live.conf
timeout  4
console-mode keep
editor   no
# editor=no: the boot-entry editor lets anyone with physical access append
# init=/bin/sh and get a root shell, bypassing every userspace control. Disk
# encryption is the answer to physical access, not an editable cmdline.
auto-entries no
auto-firmware yes
