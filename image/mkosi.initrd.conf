# Files in mkosi.extra/ are copied into the final immutable root image, after
# the default initrd has already been assembled.  The dm-verity readiness rule
# has to run before that root is mounted, so give the default initrd its own
# explicit extra tree.  mkosi reads this file only while it builds the default
# initrd; it is deliberately separate from image/mkosi.conf.

[Content]
ExtraTrees=mkosi.initrd.extra
