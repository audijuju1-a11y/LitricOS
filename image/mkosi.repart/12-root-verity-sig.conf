# Signed verity root hash.  The kernel refuses to mount a system partition whose
# root hash does not match the signature chained to the Secure Boot key, so a
# byte flipped in LITRIC_SYS_A fails the boot closed rather than continuing
# silently (Phase 03, task 2).
[Partition]
Type=root-x86-64-verity-sig
Label=LITRIC_SYSSIG_A
Verity=signature
VerityMatchKey=root
SplitName=verity-sig
