# System partition — erofs, read-only, dm-verity protected.
#
# erofs over squashfs: random-read latency is materially better (erofs does
# fixed-size compressed blocks with direct addressing rather than squashfs's
# sequential block chains), which is what page-fault-driven binary loading
# actually does.  Over btrfs: no CoW metadata, no free-space tracking, no
# write path at all — nothing in this partition is ever dirtied, so every page
# is clean, shared, and instantly evictable.  That is budget lever 4.
[Partition]
Type=root-x86-64
Label=LITRIC_SYS_A
Format=erofs
CopyFiles=/
Minimize=best
Verity=data
VerityMatchKey=root
SplitName=system
ReadOnly=yes
