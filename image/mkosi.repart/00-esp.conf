# EFI System Partition -- holds systemd-boot + the UKI + boot counters.
#
# TWO CopyFiles lines, and both are required.
#
# mkosi builds a SPLIT boot layout inside the image:
#   /efi   -> the bootloader:  EFI/BOOT/BOOTX64.EFI, EFI/systemd/, loader/keys/
#   /boot  -> the kernels:     EFI/Linux/<uki>.efi,  loader/entries/
#
# That split exists so a system can have a small ESP plus a larger XBOOTLDR
# partition. LitricOS uses a single 1 GiB ESP instead, so both trees have to be
# merged onto it. They are disjoint at the file level and merge cleanly.
#
# Copying only /boot -- as this file originally did -- produces an ESP holding a
# perfectly good UKI and no bootloader to launch it. The firmware then finds
# nothing bootable and falls through to PXE, which looks like a broken image
# rather than a missing copy instruction.
[Partition]
Type=esp
Label=LITRIC_ESP
Format=vfat
CopyFiles=/efi:/
CopyFiles=/boot:/
# Size: 512 MiB, fixed.
#
# This was 128 MiB and the desktop profile could not build: the UKI embeds the
# kernel AND the initrd (62 MiB of initrd alone, compressed), and with
# systemd-boot plus both /efi and /boot trees merged here the FAT filled and
# mcopy failed with "Disk full" -- a failure that surfaces at the very end of
# the build and reads like a mkosi bug rather than a partition that is one
# decision too small. The nano profile keeps its own small ESP in
# mkosi.repart-nano/ because the memory floor is also a disk floor.
SizeMinBytes=512M
SizeMaxBytes=512M

# Mount the ESP at /efi, not /boot.
#
# Both directories exist and are empty in the image root, so systemd's
# gpt-auto-generator had to guess, generated boot.mount, and that mount failed.
# The failure then cascaded somewhere completely unrelated: dbus-broker could not
# set up its mount namespace ("/boot: No such device") and died, taking the
# system bus with it.
#
# /efi is the modern convention when a single ESP carries both the bootloader
# and the UKIs, which is exactly this layout. Saying so explicitly removes the
# guess.
# Mounted at boot, but with nofail.
#
# This setting went through three states, and the middle one is worth recording
# because it looked right and was not:
#
#   MountPoint=/efi                  -> efi.mount failed (fsck.vfat was absent
#                                       from the image), Local File Systems
#                                       failed, boot dropped to an emergency
#                                       shell.
#   MountPoint=/efi:noauto,automount -> boot reached login, but an autofs
#                                       mountpoint breaks any service using
#                                       mount namespacing. dbus-broker died with
#                                       "Failed to set up mount namespacing:
#                                       /efi: No such device", taking the system
#                                       bus, logind and homed with it.
#   MountPoint=/efi:nofail           -> a real mount, so namespaced services see
#                                       a real filesystem; and nofail so an ESP
#                                       problem can never again make the machine
#                                       unbootable. The partition holding the
#                                       recovery path must not be able to block
#                                       recovery.
#
# The first failure was only fixable once dosfstools shipped fsck.vfat.
MountPoint=/efi:nofail
