# Writable /var.
#
# The `nano` profile gets away with `systemd.volatile=state` (tmpfs /var)
# because it is the memory floor and holds no persistent state. Everything from
# `core` upward needs real storage: without it, every service declaring
# StateDirectory= fails at startup with "Failed to set up special execution
# directory in /var/lib: Read-only file system", which is how systemd-logind and
# systemd-homed died on the first boot of this image.
#
# Btrfs rather than ext4: /var is where the update system takes its pre-update
# snapshots (Phase 08 task 6, the seven-day "undo update"), and snapshots are the
# reason Btrfs is in the locked baseline at all. ext4 here would mean the update
# story quietly has no snapshot to roll back to.
#
# GrowFileSystem so an image written to a large disk uses it, rather than staying
# at whatever size the build produced.
[Partition]
Type=var
Label=LITRIC_VAR
Format=btrfs
SizeMinBytes=64M
MountPoint=/var:nofail
