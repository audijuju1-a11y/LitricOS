# =============================================================================
# LitricOS — image definition
#
# Schema: mkosi >= 25.3.  Section and key names below are the REAL mkosi schema.
# Partition geometry is NOT expressed here — it lives in mkosi.repart/*.conf
# using systemd-repart syntax.  See docs/bugs/BUG-0001 for why that sentence
# is written in capitals.
#
# Build:   tools/build.sh --profile desktop --iso
# Verify:  ci/lint-config.sh
# =============================================================================

[Config]
MinimumVersion=25.3
# No Profiles= here. Declaring one would force it into EVERY build, including
# `nano`, whose entire purpose is to be the memory floor with nothing extra --
# a `nano` image that silently contained `core` would make the <=55 MB budget
# line meaningless. tools/build.sh passes the profile stack explicitly.

[Distribution]
Distribution=arch
Architecture=x86-64
# Reproducibility: tools/build.sh pins Repositories= to a dated
# archive.archlinux.org snapshot via a mkosi.local.conf drop-in, so that two
# builds of the same commit resolve identical package versions.  Without the pin
# Arch is a rolling target and "reproducible" is a lie.  See ADR-0013.

[Output]
Format=disk
ImageId=litricos
OutputDirectory=../build/out
CompressOutput=zstd

# 512-byte sectors, explicitly.
#
# Without this, mkosi picked a 4096-byte sector size and formatted the ESP with
# bytes-per-sector = 4096. QEMU's virtio-blk presents the disk as 512-byte
# logical blocks, so the FAT boot sector disagreed with the block device and the
# mount failed -- with no FAT-fs error in the log, because it fails before the
# filesystem driver is reached. The visible symptom was "Failed to mount /efi"
# and a dead system bus, which points nowhere near sector geometry.
#
# 512 is also the safer default on real hardware: nearly all drives present 512
# logical sectors even when the physical geometry is 4K. Native 4Kn NVMe is a
# Phase 11 hardware concern and will need this to be selectable per target.
SectorSize=512
# SplitArtifacts gives us the standalone UKI + root partition + verity blobs that
# iso/assemble-iso.sh needs to build the live ISO.
SplitArtifacts=uki,partitions

[Content]
Bootable=yes
Bootloader=systemd-boot
# none | auto | signed | unsigned -- NOT a boolean.
#
# `signed` means "a prebuilt, already-signed UKI is installed in the image at
# /usr/lib/modules/<kver>/*.efi; copy it". Arch ships no such thing, so the build
# died with "Couldn't find a signed UKI binary installed".
#
# `unsigned` means "no prebuilt UKI exists; build one with ukify" -- which is
# what we want. mkosi still signs the result with SecureBootKey because
# SecureBoot=yes below; the name refers to the INPUT, not the output.
#
# This was previously set to `yes`, which mkosi coerced to `signed`. A boolean
# where an enum was expected, silently accepted, changing the meaning entirely.
UnifiedKernelImages=unsigned
# BIOS is deliberately unsupported: UEFI-only is correct for the 2026 target and
# a CSM path would double the boot-integrity surface for no user we care about.
BiosBootloader=none

Locale=C.UTF-8
Timezone=UTC
Hostname=litricos

# Root login is disabled outright. The live ISO creates an unprivileged
# `litric` user in iso/hooks/; the installer creates the real user. Do not
# set RootPassword here: mkosi treats every non-empty value, including
# `!locked`, as literal text and hashes it. Omitting the setting leaves the
# distribution's locked root account intact.
Autologin=no

# --- kernel command line -------------------------------------------------
# roothash= is appended by iso/assemble-iso.sh AFTER the verity tree is built,
# then the UKI is re-signed.  It must never be hand-copied (Phase 03 failure mode).
KernelCommandLine=
        # Quiet, and deliberately so. Every printk is written to the serial
        # console synchronously at 115200 baud -- around 11 KB/s -- so a verbose
        # kernel log is seconds of boot time spent typing at a wire, and the
        # words then scroll over the boot splash. `quiet` keeps errors and
        # panics on the console and puts the full detail where it belongs: the
        # ring buffer (`dmesg`) and the journal, both of which stay complete.
        # The CI profile adds `loglevel=7` back for its own debugging.
        quiet
        # Force the virtio-gpu connector to the target QEMU mode. Without this the
        # fbdev console inherits whatever mode OVMF's GOP left running -- on a
        # fresh NVRAM that is 640x480 even when the host surface is 1920x1080,
        # and the shell then renders the desktop into a small corner of the QEMU
        # window. A forced modeset at fbcon init makes scanout match the requested
        # 1920x1080 mode. The framebuffer discovery path still renders at the
        # dimensions actually exposed by the kernel on systems without this mode;
        # it never scales a completed UI image to fit later.
        video=Virtual-1:1920x1080
        # ORDER MATTERS AND IS NOT COSMETIC.
        #
        # tty0 IS listed, on purpose and against the first instinct. It is not
        # here to carry messages (the `quiet` above keeps it nearly silent):
        # it is here because the framebuffer console's initialisation is what
        # performs the modeset that hands the display controller the kernel's
        # framebuffer. Without it the shell draws into /dev/fb0 while the
        # scanout still shows the firmware's frame -- a desktop that presents
        # rows nobody can see. The shell unbinds fbcon afterwards, as it always
        # has.
        #
        # When several console= arguments are given the kernel sends messages
        # to all of them and makes the LAST one /dev/console -- the one
        # userspace, systemd and any getty actually use. Serial goes LAST so it
        # is the primary console and the diagnostic channel; tty0 gets the
        # kernel's errors and nothing more, which is exactly what a screen
        # should get.
        console=tty0
        console=ttyS0,115200
        # ro, not rw. The root filesystem is erofs behind dm-verity: it is
        # read-only by construction and cannot be mounted writable. Asking for rw
        # makes systemd fight the kernel over a mount it can never win, and the
        # resulting failures land on unrelated units.
        ro
        # The root is erofs, and nothing else in the image says so. Without this,
        # the initrd's fstab-generator mounts /dev/mapper/root as ext4 (its
        # fallback), fails with "VFS: Can't find ext4 filesystem", and the boot
        # lands in emergency mode with sysroot.mount failed. It is invisible
        # whenever the boot is launched with -kernel and a command line typed by
        # hand -- which is exactly how every automated run was launched -- so the
        # first firmware boot of the image was also the first time anyone saw it.
        rootfstype=erofs
        systemd.machine_id=firstboot
        # MUST match CONFIG_LSM in kernel/config/litric-base.config. The command
        # line overrides the compiled-in default, so a mismatch means the kernel
        # config is not what actually runs. ci/lint-kconfig.py fails on a
        # disagreement between these two lists.
        # loadpin removed -- see kernel/config/litric-base.config for why.
        lsm=landlock,lockdown,yama,safesetid,integrity,apparmor,bpf
        apparmor=1
        module_blacklist=pcspkr
        mitigations=auto
        random.trust_cpu=on
        nowatchdog
        # Disable THP from boot — prevents khugepaged from raising min_free_kbytes.
        # On low-RAM targets (nano), THP saves no memory and costs ~50MB via
        # khugepaged reserves. Applications that want it can still madvise.
        transparent_hugepage=never
        rd.udev.log_level=3

# KERNEL MODULES -- the root cause of BUG-0020, and it was not the initrd.
#
# Two independent mistakes compounded here, and both were silent:
#
#   1. `KernelModulesInitrdInclude=` was the mkosi 26 spelling. mkosi 27 renamed
#      it `KernelInitrdModules=`; a setting mkosi does not know is ignored, so
#      the initrd's module list was empty.
#   2. Worse, the IMAGE's module set was empty too, which is what actually broke
#      the boot. nano.conf said `KernelModulesExclude=.*` plus
#      `KernelModulesInclude=...` -- and mkosi reads those two legacy settings as
#      *regular expressions*, not globs. `mkosi summary` prints them exactly that
#      way (`re:virtio_*`, `re:.*`), and under those semantics `re:virtio_*`
#      means "virtio followed by any number of underscores", `re:dm[-_]*` means
#      "dm" followed by any number of `-`/`_`, and `re:.*` excludes everything
#      left. The image shipped no erofs.ko and no dm-verity.ko at all.
#
#      mkosi builds the kernel-specific extra initrd by copying modules out of
#      the image's /usr/lib/modules, so an empty image set is an empty initrd no
#      matter what the initrd list says. The boot then reached
#      "Failed to mount /sysroot" with `EXT4-fs (dm-0): VFS: Can't find ext4
#      filesystem` -- the last driver tried before giving up, which reads like a
#      storage fault and is a packaging fault. Measured 2026-10-16: 10 083
#      initrd entries, 0 files ending in .ko.
#
# KERNEL MODULES IN THE IMAGE -- deliberately not restricted here.
#
# mkosi 27's `KernelModules=` takes *globs*, evaluated in order, with `-`
# meaning exclude. Its rule (mkosi/kmod.py, `filter_kernel_modules`) is:
#
#     no list at all   -> every module stays
#     exclude patterns -> every module minus those matching
#     include patterns -> ONLY those matching (an include list is a whitelist)
#
# and when both are given the exclude branch wins and the include list is dead
# code. That last rule is what produced BUG-0020's second act: the first attempt
# at a fix put `-.*` in this file ahead of a positive list, which excludes every
# module that exists. The image shipped an empty /usr/lib/modules, the extra
# initrd is copied out of that directory, and the boot could not mount its root.
# `mkosi summary` says nothing about it; only the artifact does, which is why
# tools/probe-initrd.py runs inside tools/build.sh.
#
# So the base image stays unrestricted -- a desktop image that has to boot on
# real hardware should not be trimmed to the drivers one virtual machine uses --
# and the *initrd* is the short, proven list below.
#
# ci/lint-mkosi.py checks the two lists against each other: an initrd pattern
# that the image's whitelist would drop fails the build, because mkosi copies
# the extra initrd out of the image and would find nothing to copy.
KernelInitrdModules=
        erofs
        dm-*
        virtio*
        vhost_vsock
        vsock
        sd_mod
        loop
        ext4
        fat
        nls_*

CleanPackageMetadata=yes
WithDocs=no
WithRecommends=no

# Strip what a read-only, immutable, non-developer system image never needs.
RemoveFiles=
        /usr/share/man
        /usr/share/info
        /usr/share/doc
        /usr/share/gtk-doc
        /usr/share/locale/*/LC_MESSAGES/*
        /usr/include
        /usr/lib/*.a
        /usr/share/licenses/*/COPYING*
        /var/cache/pacman

# Base package set for EVERY profile.  Kept deliberately small; profiles add.
Packages=
        base
        systemd
        systemd-sysvcompat
        systemd-ukify
        linux
        util-linux
        coreutils
        shadow
        # `pam` ships /usr/bin/unix_chkpwd (mode 4755), the helper litric-sysd
        # runs for AUTH VERIFY. It is pulled in by base/systemd on Arch today,
        # but the lock screen depends on this exact file; declare it so a
        # future package-graph change fails the build instead of silently
        # removing the only way back into a locked session.
        pam
        bash
        kmod
        dbus-broker
        erofs-utils
        # dosfstools provides fsck.vfat. Without it the ESP can never be checked
        # or repaired, and systemd's generated fstab entry (fsck pass 2) creates
        # a dependency that cannot be satisfied -- efi.mount fails, Local File
        # Systems fails, and the boot lands in an emergency shell. For a system
        # whose entire update and recovery story lives on the ESP, having no way
        # to fsck it is a real gap rather than a build detail.
        dosfstools
        cryptsetup
        btrfs-progs
        zram-generator

# NOTE: mkosi automatically applies a `mkosi.extra/` and a `mkosi.skeleton/`
# directory next to this file. Declaring them here as well applies them TWICE
# and, for a directory that does not exist, fails the build. So they are
# deliberately not declared. ci/lint-mkosi.py enforces that any tree that IS
# declared actually exists.

[Validation]
# Dev keys.  Production keys never live in the repository — see ADR-0013 §4.
SecureBoot=yes
SecureBootKey=../keys/dev/secureboot.key
SecureBootCertificate=../keys/dev/secureboot.crt
SecureBootAutoEnroll=yes
SignExpectedPcr=yes
# A separate key from SecureBootKey by design: Secure Boot authorises code, the
# PCR key attests to a boot measurement. Sharing one key would mean a compromise
# of either capability compromises both.
SignExpectedPcrKey=../keys/dev/pcr.key
SignExpectedPcrCertificate=../keys/dev/pcr.crt
Verity=signed
VerityKey=../keys/dev/verity.key
VerityCertificate=../keys/dev/verity.crt

[Build]
# CacheDirectory lives here, not in [Output]. mkosi 26 rejects it in [Output]
# with "should be configured in [Build]" -- and ci/lint-mkosi.py had it in the
# wrong section too, so the linter passed a config mkosi refuses. Both are fixed.
CacheDirectory=../build/cache

# The image build must not reach the network for anything except the pinned
# package repository, so that a build is a function of (commit, snapshot date).
WithNetwork=yes
Environment=
        SOURCE_DATE_EPOCH=1756166400

[Runtime]
RAM=4G
CPUs=4
KVM=auto
