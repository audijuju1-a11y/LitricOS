# =============================================================================
# PROFILE: core — nano + device management + storage + network.  Headless.
# Budget: <= 95 MB idle, <= 2.0 s boot.
# =============================================================================
[Content]
Packages=
        iwd
        wireless-regdb
        systemd-resolvconf
        nftables
        e2fsprogs
        dosfstools
        gptfdisk
        openssh
        less
        nano
        pciutils
        usbutils
        # measurement tools — these are how the budget is enforced, so they are
        # part of the product, not a debug extra
        procps-ng
        sysstat
        strace
        # No `smem`: it is AUR-only, and PSS is available without it.
        # /proc/<pid>/smaps_rollup reports Pss directly and is the authoritative
        # source smem itself reads, so depending on smem would add an out-of-repo
        # package to read a file we can read ourselves.
