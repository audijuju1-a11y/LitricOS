# =============================================================================
# PROFILE: desktop — the headline profile.
# Budget: <= 320 MB idle, <= 0.5% idle CPU, <= 3.5 s boot, <= 850 MB ISO.
#
# NOTE the absence of gtk3, gtk4, qt5, qt6, and any browser engine.  That absence
# is the budget (ADR-0009) and ci/lint-budget.sh asserts it: if any of those
# appear in the resolved dependency closure, the build fails.
# =============================================================================
[Content]
Packages=
        # --- graphics -------------------------------------------------------
        mesa
        vulkan-icd-loader
        libdrm
        libinput
        seatd
        # Mesa driver selection is trimmed by mkosi.postinst.chroot.d/20-trim-mesa.sh
        # (Phase 05 task 5) — we ship radeonsi/RADV, ANV/Iris, NVK, Zink, virtio
        # and delete the rest.

        # --- audio ----------------------------------------------------------
        pipewire
        pipewire-pulse
        pipewire-alsa
        pipewire-jack
        wireplumber

        # --- fonts (one family, four weights — not a font collection) --------
        inter-font
        ttf-jetbrains-mono-nerd
        noto-fonts
        noto-fonts-emoji

        # --- app platform ---------------------------------------------------
        flatpak
        bubblewrap
        xdg-desktop-portal
        xdg-user-dirs

        # --- security -------------------------------------------------------
        yara
        libseccomp
        tpm2-tools
        fwupd

        # --- firmware (split packages — the monolithic linux-firmware is
        #     ~1.4 GB and would blow the ISO budget on its own) ---------------
        linux-firmware-intel
        linux-firmware-amdgpu
        linux-firmware-radeon
        linux-firmware-atheros
        linux-firmware-realtek
        linux-firmware-mediatek
        sof-firmware

        # --- browser engine (ADR-0018) ---------------------------------------
        # Litric Browser's interface, policy and broker are ours; the engine is
        # the distribution's Chromium, run headless and driven over a pipe.
        # This supersedes the "no browser engine" budget note in ADR-0009 for
        # the desktop profile only; nano and core stay engine-free.
        chromium

        # --- LitricOS first-party (built from src/, see mkosi.prepare) -------
        # litric-shell, litric-defender, litric-capd, litricctl are installed by
        # mkosi.extra + the build script, not by pacman.
