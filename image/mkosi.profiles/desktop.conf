# =============================================================================
# PROFILE: desktop — the headline profile.
# Budget: <= 320 MB idle, <= 0.5% idle CPU, <= 3.5 s boot, <= 850 MB ISO.
#
# NOTE the absence of gtk3, gtk4, qt5, qt6, and any browser engine in this list.
# That absence is the budget (ADR-0009).
#
# This comment used to say ci/lint-budget.sh asserts it and fails the build when
# one appears in the resolved dependency closure. No such file has ever existed,
# so the sentence was an enforcement claim nobody could run (recorded in
# docs/audit/2026-10-11-beta-1.0-stage-a-audit.md §12 and docs/GATES.md). Nothing
# checks the closure today: doing it needs pacman on the build host, and what can
# be checked statically is this declared list, not what the packages pull in.
# Until that exists, the honest statement is that this list is reviewed by hand.
# =============================================================================
[Content]
Packages=
        # --- graphics -------------------------------------------------------
        mesa
        vulkan-icd-loader
        libdrm
        libinput
        seatd
        # Mesa driver selection is trimmed by mkosi.postinst.chroot.d/20-trim-mesa.sh
        # (Phase 05 task 5) — we ship radeonsi/RADV, ANV/Iris, NVK, Zink, virtio
        # and delete the rest.

        # --- audio ----------------------------------------------------------
        # `wireplumber` is what makes the sound controls real: it ships `wpctl`,
        # the client `litric-sysd` runs to set the default sink's volume and mute
        # state (ADR-0023 decision 2 — the provider's own tool, not a D-Bus
        # client in the daemon).
        pipewire
        pipewire-pulse
        pipewire-alsa
        pipewire-jack
        wireplumber

        # --- bluetooth ------------------------------------------------------
        # `bluez` is the daemon and `bluez-utils` ships `bluetoothctl`, which is
        # the tool the daemon runs for radio state, scanning and pairing.
        # Added 2026-10-12 with the wave-1 write half. Neither package had a row
        # in docs/PERF-budget.md before this; the idle-memory consequence is
        # measured in the GATE 01 entry of 2026-10-12 rather than assumed, and
        # `litric-sysd` grants no Bluetooth action at all until the adapter
        # facts say one exists.
        bluez
        bluez-utils

        # --- fonts (one family, four weights — not a font collection) --------
        inter-font
        ttf-jetbrains-mono-nerd
        noto-fonts
        noto-fonts-emoji

        # --- app platform ---------------------------------------------------
        flatpak
        bubblewrap
        xdg-desktop-portal
        xdg-user-dirs

        # --- security -------------------------------------------------------
        yara
        libseccomp
        tpm2-tools
        fwupd

        # --- firmware (split packages — the monolithic linux-firmware is
        #     ~1.4 GB and would blow the ISO budget on its own) ---------------
        linux-firmware-intel
        linux-firmware-amdgpu
        linux-firmware-radeon
        linux-firmware-atheros
        linux-firmware-realtek
        linux-firmware-mediatek
        sof-firmware

        # --- browser engine (ADR-0018) ---------------------------------------
        # Litric Browser's interface, policy and broker are ours; the engine is
        # the distribution's Chromium, run headless and driven over a pipe.
        # This supersedes the "no browser engine" budget note in ADR-0009 for
        # the desktop profile only; nano and core stay engine-free.
        chromium

        # --- LitricOS first-party (built from src/, see mkosi.prepare) -------
        # litric-shell, litric-sysd, litric-envd and litric-browserd are installed
        # by mkosi.extra + the build script, not by pacman. This line used to name
        # litric-capd and litricctl, which no crate builds: ADR-0016 moved the
        # capability broker inside litric-sysd, and their units are parked in
        # image/units-pending/ for that reason.
