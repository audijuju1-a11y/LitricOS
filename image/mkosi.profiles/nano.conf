# =============================================================================
# PROFILE: nano -- kernel + init + serial console.  CI and embedded.
# Budget: <= 55 MB idle, <= 1.2 s boot, <= 90 MB ISO.
# This profile is the memory floor.  Everything else is measured against it.
#
# NOTE: there is deliberately NO `Packages=` line here.
# =============================================================================

[Content]

# linux-firmware is ~1.4 GB of device firmware that a virtio-only CI image never
# loads. Removing it is the single biggest disk saving in this profile.
RemovePackages=
        linux-firmware
        btrfs-progs
        zram-generator
        xfsprogs
        plocate

# RemoveFiles: only remove what is genuinely unnecessary for a booting system.
# DO NOT remove coreutils (cat, head, tail, echo, mount, etc.) — systemd and
# litric services use them in ExecStart= and shell scripts.
RemoveFiles=
        # zram does not belong in nano
        /usr/lib/systemd/zram-generator.conf
        /usr/lib/modules-load.d/litric-zram.conf

        # Trim /usr/share — CI/embedded never needs these
        /usr/share/i18n
        /usr/share/gir-1.0
        /usr/share/hwdata
        /usr/share/file
        /usr/share/iana-etc
        /usr/share/licenses
        /usr/share/bash-completion
        /usr/share/terminfo
        /usr/share/man
        /usr/share/doc
        /usr/share/info
        /usr/share/gtk-doc
        /usr/share/vim

        # ICU data — 32MB, not needed for serial console CI
        /usr/lib/libicudata.so*
        /usr/lib/libicui18n.so*
        /usr/lib/libicuuc.so*

        # Hardware database — 14MB, not needed for QEMU virtio
        /usr/lib/udev/hwdb.bin
        /usr/lib/udev/hwdb.d

        # Python — 17MB, not needed in nano
        /usr/lib/python3.14
        /usr/lib/libpython3.14*

        # Kernel build artifacts (not runtime modules, just build/ source)
        /usr/lib/modules/*/build
        /usr/lib/modules/*/source
        /usr/lib/modules/*/Module.symvers
        /usr/lib/modules/*/scripts
        /usr/lib/modules/*/System.map

        # Developer-only tools — not needed at runtime
        /usr/bin/xgettext
