# Kernel module trimming: keep only what a boot and a desktop need.
#
# THIS IS WHERE BUG-0020 CAME FROM. The trim used to be spelled
#
#     KernelModulesExclude=.*
#     KernelModulesInclude=virtio_* dm[-_]* ...
#
# which are the mkosi 26 settings, and mkosi 27 reads both of them as *regular
# expressions* (`mkosi summary` prints `re:virtio_*`, `re:.*`). `re:virtio_*` is
# "virtio" plus any number of underscores -- it matched no real module -- and
# `re:.*` then excluded every remaining one. The image shipped zero modules, the
# extra initrd is built by copying modules out of the image, so the initrd
# shipped zero modules too, and the erofs-behind-dm-verity root could not be
# mounted. See docs/bugs/BUG-0020.
#
# A positive list, and nothing else: mkosi's rule is that an include list is a
# *whitelist* -- the modules matching it are the modules the image keeps -- so
# this profile stays a size floor by naming what it keeps rather than by trying
# to subtract 170MB of drivers. Note what is NOT here: a leading `-.*`. Adding
# one would flip mkosi into its exclude branch, where the whitelist below becomes
# dead code and the image keeps nothing at all (BUG-0020). ci/lint-mkosi.py
# fails the build on that combination.
KernelModules=
        erofs
        dm-*
        virtio*
        vhost_vsock
        vsock
        sd_mod
        loop
        ext4
        fat
        vfat
        nls_*
        isofs
        squashfs
        overlay
        uinput
        fb_*
        drm_fb_helper
        ahci
        9p
        9pnet*

# The boot's module needs are the same for every profile, so the initrd list is
# in mkosi.conf rather than copied here: two copies is how one of them ends up
# stale. ci/lint-mkosi.py checks that the initrd list never asks for a module the
# image list does not carry.

# nano is the CI and measurement profile. It shares the base image's account
# policy, so it deliberately has no RootPassword setting. See mkosi.conf:
# mkosi hashes every non-empty value rather than treating a bang-prefixed value
# as a shadow lock marker.
KernelCommandLine=
        systemd.volatile=state
        # The kernel's full log on the serial console. The base line is quiet
        # because a product's boot must not spend seconds printing at a wire;
        # the profile that exists to measure and debug boots wants every word.
        # Both keep the framebuffer out of the console list, so no kernel line
        # ever lands on the shell's screen whatever this says.
        loglevel=7

