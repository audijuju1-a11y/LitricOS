# =============================================================================
# PROFILE: nano -- kernel + init + serial console.  CI and embedded.
# Budget: <= 55 MB idle, <= 1.2 s boot, <= 90 MB ISO.
# This profile is the memory floor.  Everything else is measured against it.
#
# NOTE: there is deliberately NO `Packages=` line here.
# =============================================================================

[Content]

# linux-firmware is ~1.4 GB of device firmware that a virtio-only CI image never
# loads. Removing it is the single biggest disk saving in this profile.
RemovePackages=
        linux-firmware
        btrfs-progs
        zram-generator
        xfsprogs
        plocate

# RemoveFiles: only remove what is genuinely unnecessary for a booting system.
# DO NOT remove coreutils (cat, head, tail, echo, mount, etc.) — systemd and
# litric services use them in ExecStart= and shell scripts.
RemoveFiles=
        # zram does not belong in nano
        /usr/lib/systemd/zram-generator.conf
        /usr/lib/modules-load.d/litric-zram.conf

        # Trim /usr/share — CI/embedded never needs these
        /usr/share/i18n
        /usr/share/gir-1.0
        /usr/share/hwdata
        /usr/share/file
        /usr/share/iana-etc
        /usr/share/licenses
        /usr/share/bash-completion
        /usr/share/terminfo
        /usr/share/man
        /usr/share/doc
        /usr/share/info
        /usr/share/gtk-doc
        /usr/share/vim

        # ICU data — 32MB, not needed for serial console CI
        /usr/lib/libicudata.so*
        /usr/lib/libicui18n.so*
        /usr/lib/libicuuc.so*

        # Hardware database — 14MB, not needed for QEMU virtio
        /usr/lib/udev/hwdb.bin
        /usr/lib/udev/hwdb.d

        # Python — 17MB, not needed in nano
        /usr/lib/python3.14
        /usr/lib/libpython3.14*

        # Kernel build artifacts (not runtime modules, just build/ source)
        /usr/lib/modules/*/build
        /usr/lib/modules/*/source
        /usr/lib/modules/*/Module.symvers
        /usr/lib/modules/*/scripts
        /usr/lib/modules/*/System.map

        # Developer-only tools — not needed at runtime
        /usr/bin/xgettext
        /usr/bin/gettext
        /usr/bin/msgfmt
        /usr/bin/msgmerge
        /usr/bin/msgcat
        /usr/bin/msgunfmt
        /usr/bin/msgconv
        /usr/bin/msgfilter

        # sqlite3 — 8MB, not needed in nano
        /usr/bin/sqlite3*
        /usr/bin/dump_ldconfig

        # Compiler/linker tools — not needed at runtime
        /usr/bin/ld
        /usr/bin/ld.gold
        /usr/bin/ld.bfd
        /usr/bin/as
        /usr/bin/ar
        /usr/bin/nm
        /usr/bin/objcopy
        /usr/bin/objdump
        /usr/bin/readelf
        /usr/bin/strings
        /usr/bin/strip
        /usr/bin/c++filt
        /usr/bin/addr2line

        # Debug tools — not needed at runtime
        /usr/bin/gdb*
        /usr/bin/ltrace
        /usr/bin/strace
        /usr/bin/perf
        /usr/bin/pahole
        /usr/bin/dwarves
        /usr/bin/elfutils*

        # Archive tools — not needed at runtime
        /usr/bin/tar
        /usr/bin/cpio
        /usr/bin/gzip
        /usr/bin/bzip2
        /usr/bin/xz
        /usr/bin/unxz
        /usr/bin/unzip
        /usr/bin/zip
        /usr/bin/zstd
        /usr/bin/lz4
        /usr/bin/lzop
        /usr/bin/pigz
        /usr/bin/unpigz

        # Network tools — not needed in nano
        /usr/bin/curl
        /usr/bin/wget
        /usr/bin/ssh*
        /usr/bin/scp
        /usr/bin/sftp
        /usr/bin/rsync
        /usr/bin/netctl*
        /usr/bin/wpa_supplicant*
        /usr/bin/iw*
        /usr/bin/rfkill
        /usr/bin/bridge
        /usr/bin/nc
        /usr/bin/ncat
        /usr/bin/socat
        /usr/bin/nslookup
        /usr/bin/dig
        /usr/bin/host
        /usr/bin/traceroute
        /usr/bin/tracepath
        /usr/bin/arping
        /usr/bin/arpping
        /usr/bin/ether-wake
        /usr/bin/ipcalc
        /usr/bin/clockdiff
        /usr/bin/arp
        /usr/bin/portmap
        /usr/bin/rpcinfo
        /usr/bin/rpcgen
        /usr/bin/showmount

        # Editor tools — not needed in nano
        /usr/bin/vim*
        /usr/bin/ed
        /usr/bin/ex
        /usr/bin/rvim
        /usr/bin/rview
        /usr/bin/view

        # Shell extras — not needed (keep /bin/sh and bash)
        /usr/bin/dash
        /usr/bin/zsh
        /usr/bin/fish
        /usr/bin/tcsh
        /usr/bin/csh
        /usr/bin/ksh

        # Crypto tools — not needed at runtime
        /usr/bin/gpg*
        /usr/bin/gpgme*
        /usr/bin/gpgv*
        /usr/bin/gpg-agent*
        /usr/bin/gpg-connect-agent*
        /usr/bin/gpgconf*

        # Monitoring/diagnostic — not needed at runtime
        /usr/bin/htop
        /usr/bin/top
        /usr/bin/powertop
        /usr/bin/tuned-adm
        /usr/bin/lscpu
        /usr/bin/lspci
        /usr/bin/lsusb
        /usr/bin/lshw
        /usr/bin/hwinfo
        /usr/bin/dmidecode
        /usr/bin/sensors
        /usr/bin/hddtemp
        /usr/bin/smartctl
        /usr/bin/hdparm

        # Disk tools — not needed at runtime
        /usr/bin/fdisk
        /usr/bin/parted
        /usr/bin/gdisk
        /usr/bin/sgdisk
        /usr/bin/dumpe2fs
        /usr/bin/tune2fs
        /usr/bin/e2fsck
        /usr/bin/mke2fs
        /usr/bin/debugfs
        /usr/bin/logsave
        /usr/bin/mkfs*
        /usr/bin/fsck*
        /usr/bin/resize*
        /usr/bin/lsattr
        /usr/bin/chattr

        # Misc not needed
        /usr/bin/less
        /usr/bin/most
        /usr/bin/man
        /usr/bin/plocate
        /usr/bin/updatedb
        /usr/bin/locate
        /usr/bin/git*
        /usr/bin/rdiff-backup*
        /usr/bin/fakechroot
        /usr/bin/fakeroot
        /usr/bin/schroot
        /usr/bin/cpulimit
        /usr/bin/cpufreq*
        /usr/bin/setarch
        /usr/bin/linux32
        /usr/bin/linux64
        /usr/bin/stackprotector*
        /usr/bin/sk-helper
        /usr/bin/sftp-server
        /usr/bin/ssh-shellhost
        /usr/bin/ssh-skip-agent
        /usr/bin/ssh-vulncheck
        /usr/bin/sshsign
        /usr/bin/ssh-keygen
        /usr/bin/ssh-keyscan
        /usr/bin/ssh-add
        /usr/bin/ssh-agent

        # Additional large binaries
        /usr/bin/openssl
        /usr/bin/iconv
        /usr/bin/zdump
        /usr/bin/zic
        /usr/bin/tzselect
        /usr/bin/hwclock
        /usr/bin/finger
        /usr/bin/write
        /usr/bin/lastb
        /usr/bin/ac
        /usr/bin/lastlog
        /usr/bin/faillog
        /usr/bin/captree

# Kernel module trimming: keep only what nano (QEMU virtio) needs.
# Saves ~160MB from the 172MB module directory.
KernelModulesExclude=.*
KernelModulesInclude=
        virtio_*
        virtiofs
        dm[-_]*
        dm-verity
        sd_mod
        ahci
        erofs
        btrfs
        overlay
        loop
        ext4
        nls_*
        fat
        vfat
        isofs
        input_*
        evdev
        serio
        atkbd
        i8042
        pcspkr
        kbd
        framebuffer
        fb_*
        drm_fb_helper
        uinput
        9pnet
        9p
        vsock

# Initrd trimming: only include what nano needs to boot.
KernelModulesInitrdInclude=
        virtio_*
        dm[-_]*
        dm-verity
        sd_mod
        ahci
        erofs
        btrfs
        loop
        ext4
        nls_*
        fat
        vfat
        overlay

# nano is the CI and measurement profile
RootPassword=litric
KernelCommandLine=
        systemd.volatile=state

