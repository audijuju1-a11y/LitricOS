# =============================================================================
# PROFILE: gaming — desktop + the Phase 12 stack.
# Budget: <= 420 MB idle.  Gaming Mode is OFF at boot; nothing here runs until
# the user turns it on, so the idle delta over `desktop` is disk, not RAM.
#
# Nothing in this profile touches KernelCommandLine.  Gaming Mode changes runtime
# state only, never boot state, so that toggling it off is a complete restore
# (GATE 12) and a crash can never leave the machine in a gaming-tuned boot
# configuration.  `mitigations=off` in particular is never a build-time flag.
# =============================================================================
[Content]
Packages=
        gamescope
        gamemode
        lib32-gamemode
        mangohud
        lib32-mangohud
        vulkan-tools
        scx-scheds
        # ntsync is a kernel feature (CONFIG_NTSYNC), not a package; the module
        # is loaded by modules-load.d only when Gaming Mode is enabled.
