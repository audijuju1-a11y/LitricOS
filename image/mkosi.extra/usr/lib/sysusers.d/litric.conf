# The desktop user.
#
# Programs that act on the user's behalf -- the browser engine broker
# (ADR-0018) and the file daemon (ADR-0019) -- run as this account, never as
# root. Chromium refuses to start its sandbox as uid 0, and a file daemon that
# runs as root turns every path-confinement bug into a system compromise.
#
# The root filesystem is read-only erofs, so this cannot be applied at boot;
# mkosi runs systemd-sysusers against the image during the build.
g litric 1000
u litric 1000:1000 "LitricOS user" /var/home/litric /usr/bin/bash
