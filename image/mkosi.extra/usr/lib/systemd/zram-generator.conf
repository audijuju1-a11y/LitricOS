# zram, not disk swap.  On a machine with a read-only erofs system partition and
# a Btrfs user partition, disk swap buys latency problems and SSD wear; zram buys
# effective memory at the cost of CPU we have.
#
# zram-size = ram: the kernel accounts zram at its uncompressed size, and real
# zstd ratios land near 3:1-5:1, so effective headroom is larger than the number
# suggests.  Measured ratios go in docs/EVIDENCE.md, never in a claim.
#
# zstd for the desktop profile; the gaming profile switches to lz4 at runtime via
# litricctl (decompression throughput matters more than ratio when a frame
# deadline is on the line).  Phase 13 task 3 runs the matrix before we defend
# either choice.
[zram0]
zram-size = ram
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
