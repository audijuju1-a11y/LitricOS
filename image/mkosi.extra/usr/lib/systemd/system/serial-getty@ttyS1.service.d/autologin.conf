# LitricOS — lab diagnostic console on the second serial port.
#
# The image's root filesystem is immutable (erofs + dm-verity) and root's
# password is locked, so nothing on the box could answer "why did this unit
# die" — every diagnosis ended as a guess from one-way serial prints. The
# desktop image is a disposable lab artifact driven by QEMU, the console is
# reachable only through a host-side socket this test harness creates, and
# the shell itself already runs as root, so an unauthenticated serial shell
# adds no privilege the harness does not already have. It converts every
# future failure from archaeology into a one-line answer.
#
# ttyS0 stays the kernel/system log; ttyS1 is this interactive console.

[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --autologin root --noclear --keep-baud 115200,57600,38400,9600 %I vt100
