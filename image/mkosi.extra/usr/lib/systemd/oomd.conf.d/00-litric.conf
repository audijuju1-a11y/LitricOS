# PSI-based OOM management.  The point is to act BEFORE the kernel OOM killer,
# because oomd kills by policy (the greediest app in an eligible slice) and the
# kernel kills by heuristic (whatever scores worst, which is often the shell).
[OOM]
SwapUsedLimit=95%
DefaultMemoryPressureLimit=60%
DefaultMemoryPressureDurationSec=15s
