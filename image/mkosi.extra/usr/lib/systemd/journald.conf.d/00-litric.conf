# Budget line 3: journald <= 10 MB.
#
# Storage=volatile is a memory decision AND a disk decision: it removes the
# largest single source of idle disk writes, which is what keeps the <= 2 MB /
# 10 min idle-write budget reachable and lets SSDs reach their low-power states.
# Persistent logging is enabled only in the recovery/diagnostic boot entry.
[Journal]
Storage=volatile
RuntimeMaxUse=16M
RuntimeMaxFileSize=4M
RuntimeKeepFree=64M
SystemMaxUse=0
ForwardToSyslog=no
ForwardToWall=no
ForwardToKMsg=no
Compress=yes
Seal=no
RateLimitIntervalSec=30s
RateLimitBurst=1000
MaxLevelStore=info
MaxLevelSyslog=warning
MaxLevelKMsg=warning
