# LitricOS — the directory iwd keeps network credentials in.
#
# `NET WIFI JOIN` writes `<ssid>.psk` here, and `litric-sysd.service` opens
# exactly this one path for writing (ReadWritePaths=/var/lib/iwd) because
# ProtectSystem=strict makes /var read-only inside its mount namespace.
#
# systemd refuses to start a unit whose ReadWritePaths does not exist — it is
# mount-namespace setup, not a warning — so the directory must be there before
# the daemon's namespace is built. iwd.service would create it itself through
# StateDirectory=iwd, but that makes the daemon's start depend on iwd's, which
# is a dependency the daemon does not have. Creating it at boot instead keeps
# the two independent, and /var is a writable btrfs partition even though / is
# erofs behind dm-verity.
#
# 0700 root: iwd runs as root and no other account has any business reading a
# stored passphrase.

d /var/lib/iwd 0700 root root - -
