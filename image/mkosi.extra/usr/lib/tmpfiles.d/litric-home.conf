# LitricOS — the runtime directories and the desktop account's home.
#
# The root filesystem is erofs behind dm-verity and is read-only, but /var is
# its own btrfs partition written for exactly this reason
# (image/mkosi.repart/20-var.conf, `MountPoint=/var:nofail`), so a home
# directory under /var can exist and survive. It was never created: the account
# in sysusers.d/litric.conf names `/var/home/litric` as its home, and nothing
# made that directory, which left every invocation that reads `$HOME` from
# passwd (D-Bus, xdg-user-dirs, `flatpak --user`, GTK's config folder) pointing
# at a path that does not exist.
#
# Two entries, in this order:
#
#   /var/home           the parent; 0755 so the account can be reached by name
#   /var/home/litric    the user's own; 0700, because a home is private
#
# `litric` is created by systemd-sysusers at image build time, so the names
# here resolve. On the `nano` profile /var is `systemd.volatile=state` (tmpfs)
# and this file recreates both directories at every boot, which is the same
# rule as everywhere else.
#
# The browser's profile root is deliberately NOT here: it is a RuntimeDirectory
# owned by the unit's User=, because a browser profile is discardable state and
# belongs on /run (ADR-0018).
#
# This file also owns the socket's parent (/run/litric), a tmpfs that is empty
# at every boot.

d /run/litric 0755 root root - -
d /var/home 0755 root root - -
d /var/home/litric 0700 litric litric - -
