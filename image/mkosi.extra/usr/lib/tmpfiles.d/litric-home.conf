# LitricOS — the browser engine's runtime directories.
#
# The root filesystem is erofs behind dm-verity: /var/home cannot be created
# at boot and the engine's writable state belongs on /run instead. The unit
# itself declares RuntimeDirectory=litric-browser, which is the authoritative
# mechanism and creates the profile root owned by User= before the mount
# namespace is set up. This file exists only for the socket's parent
# (/run/litric), a tmpfs that is empty at every boot.

d /run/litric 0755 root root - -
