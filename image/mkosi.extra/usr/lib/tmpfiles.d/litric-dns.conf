# LitricOS — DNS resolver plumbing, recreated at every boot.
#
# systemd-resolved answers on 127.0.0.53 (the stub). /etc is regenerated by a
# later mkosi phase and a symlink committed from the Windows host would arrive
# as a plain file anyway, so the link is created by tmpfiles at boot instead —
# the distro-standard way to keep /etc/resolv.conf pointing at the stub even
# on a read-only or freshly-regenerated root.

L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf
