# LitricOS — the updater's one writable root.
#
# `litric-sysd --boot` reads the A/B generation record below this directory and
# `litric-sysd --serve` exposes it. `ProtectSystem=strict` makes /var read-only
# in the unit's mount namespace, and systemd refuses to start a unit whose
# ReadWritePaths does not exist, so tmpfiles creates both directories before the
# namespace is built.
#
# `incoming` is where a verified candidate tree is placed before
# `UPDATE STAGE <version> <relative-path> CONFIRM`. The service refuses an
# absolute or `..` path, so this directory is the whole source surface.
#
# 0700 root: a candidate is bootable system material and a staged state record
# names it. No other account has any business reading or replacing either.

d /var/lib/litric/update 0700 root root - -
d /var/lib/litric/update/incoming 0700 root root - -
