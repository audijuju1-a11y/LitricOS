# Load zram at boot.
#
# zram-generator writes a swap unit for /dev/zram0, but the device only exists
# once the module is loaded. Without this the unit waits for a device that will
# never appear, times out after 90 seconds, and turns a five-second boot into a
# ninety-seven-second one -- the single largest boot-time cost measured so far.
#
# The module IS present in the image (drivers/block/zram/zram.ko.zst); nothing
# was asking for it.
zram
