# Networking — throughput and latency defaults that are safe for everyone.
# The aggressive latency knobs (busy_poll, coalescing) are NOT here: they cost
# power and are Gaming Mode toggles with measured before/after (Phase 04 task 5).

# BBR + fq: better behaviour on lossy links and on shared home uplinks than
# cubic + pfifo_fast, without the bufferbloat of a large tx queue.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Modern buffer sizing for gigabit-and-above links.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192

# Faster recovery and reconnect.
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300

# Hardening (defence, not tuning).
#
# rp_filter is OFF, and that is a measured decision, not an oversight: with
# strict mode (1) the kernel drops a DHCP OFFER before any address exists on
# the interface — the offer's source (10.0.2.2 in the lab NAT, the router on
# a LAN) has no route yet, so the reverse-path check fails and the lease
# never happens. Observed live: "martian source (src=10.0.2.2,
# dst=255.255.255.255)" on every boot, no lease, no route, and the browser
# engine reporting a dead network. Loose/absent rp_filter costs nothing here
# that the other hardening lines do not already cover (redirects, source
# route, martian logging all stay on).
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
# The upstream Arch default (10-arch.conf) sets a per-interface glob to loose
# mode; files later in the sort order win, so this line supersedes it — and a
# glob here is what re-arms filtering on interfaces that appear after boot.
net.ipv4.conf.*.rp_filter = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_ra = 1
net.ipv6.conf.all.accept_source_route = 0

# Privacy: prefer temporary IPv6 addresses so a device is not trackable by its
# MAC-derived suffix across networks.
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2
