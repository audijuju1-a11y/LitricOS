# Kernel hardening.
#
# Rule for this file: every line either has no user-visible cost, or its cost is
# named.  A hardening knob that silently breaks a workflow gets reverted by the
# first user who hits it, which is worse than not shipping it.

# --- information leaks ------------------------------------------------------
# Hide kernel pointers from /proc and dmesg — removes the easiest KASLR bypass.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# perf is a kernel-memory read primitive.  3 = unprivileged perf disabled.
# COST: `perf` requires root.  The LitricOS bench harness already runs as root
# (tools/bench/), and Gaming Mode overlays (MangoHud) do not use perf.
kernel.perf_event_paranoid = 3

# --- process boundaries -----------------------------------------------------
# 1 = a process may only ptrace its own descendants.
# COST: attaching gdb to an already-running unrelated process needs root or
# CAP_SYS_PTRACE.  Debugging your own child processes is unaffected, which is
# what a debugger actually does.  Developer Mode (RUNTIME §22) relaxes this
# per-session rather than globally.
kernel.yama.ptrace_scope = 1

# --- attack surface reduction ----------------------------------------------
# Unprivileged BPF is a recurring source of privilege escalation.  Our BPF users
# (defender BPF-LSM, scx_lavd) all load as root.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Nothing legitimately kexecs on this system; the update path reboots normally.
# Blocking it removes a way to boot an unsigned kernel from a root compromise.
kernel.kexec_load_disabled = 1

# TIOCSTI lets a process inject keystrokes into its controlling terminal — a
# classic sandbox escape from a terminal-hosted process.
dev.tty.legacy_tiocsti = 0
dev.tty.ldisc_autoload = 0

# userfaultfd is a well-known heap-grooming aid for use-after-free exploitation.
vm.unprivileged_userfaultfd = 0

# --- filesystem -------------------------------------------------------------
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# A core dump of a setuid binary can contain another user's secrets.
fs.suid_dumpable = 0

# --- ASLR -------------------------------------------------------------------
kernel.randomize_va_space = 2
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16

# --- SysRq ------------------------------------------------------------------
# 176 = sync (16) + remount-ro (32) + nice-all-RT (128).  Keeps the "unwedge the
# machine without corrupting the filesystem" combinations and drops the ones that
# are a local DoS or a memory-dump primitive.
kernel.sysrq = 176

# --- misc -------------------------------------------------------------------
# Do not leak the boot-time entropy state or allow unprivileged userns abuse to
# be entirely free; userns is REQUIRED by bubblewrap/Flatpak so it stays on, and
# is instead constrained by seccomp + Landlock per app (Phase 07).
kernel.unprivileged_userns_clone = 1
