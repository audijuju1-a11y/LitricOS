# Scheduler and latency.
#
# The default EEVDF scheduler is good.  These values bias it toward interactive
# responsiveness, which is what "smooth" means to a user, and are the baseline
# that scx_lavd (Gaming Mode, Phase 12) is measured against.

# Autogroup: per-session-leader fair sharing.  A `make -j32` in a terminal stops
# starving the shell.  This is one of the highest smoothness-per-line-of-config
# settings that exists and it is off by default on many distributions.
kernel.sched_autogroup_enabled = 1

# Do not let a runaway realtime thread lock the machine; leave 5% for everyone
# else.  Audio's realtime threads are far below this ceiling.
kernel.sched_rt_runtime_us = 950000
kernel.sched_rt_period_us = 1000000

# Split-lock detection: a misbehaving (usually Windows-origin, via Proton) binary
# doing an unaligned atomic across a cache line can stall every core.  `warn`
# logs it without the throughput penalty of `fatal` and without silently
# tolerating it as `off` does.  Gaming Mode exposes this as a knob.
kernel.split_lock_mitigate = 1
