# Memory management — tuned for a zram-only swap topology.
# Each value carries the reason it is not the default.

# 180, not 60.  The default assumes swapping to a disk that is ~1000x slower than
# RAM.  Swapping to zram is ~10x slower than RAM, so the kernel should prefer
# reclaiming anonymous pages over evicting the page cache far more aggressively
# than the default allows.  100 is "equal cost"; >100 says anon is cheaper.
# 0 for idle-low-RAM mode. zram is the swap device but on a fresh boot
# with no pressure, we want zero swapping so free -h reports real usage.
# litric-sysd or oomd can raise this if PSI memory pressure is detected.
vm.swappiness = 0

# Reclaim earlier and in bigger steps so that a memory spike meets an already-
# growing free pool instead of a direct-reclaim stall.  This is the single knob
# most responsible for "the desktop froze for two seconds".
# Lower watermarks: reclaim starts earlier, keeps more pages free.
vm.watermark_scale_factor = 50
vm.watermark_boost_factor = 0

# zram has no seek cost and no readahead benefit; reading 8 pages to use 1 is
# pure waste of decompression CPU.  0 = one page at a time.
vm.page-cluster = 0

# Keep dirty page writeback smooth rather than bursty.  A large dirty pool turns
# into a multi-second stall when it finally flushes.
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 1500

# Large mmap count needed by modern games/Proton and by the shell's GPU buffers.
vm.max_map_count = 2147483642

# Do not overcommit into the ground; oomd (PSI) should act before the kernel OOM
# killer ever does, because oomd kills by policy and the kernel kills by heuristic.
vm.overcommit_memory = 0
vm.overcommit_ratio = 50

# MGLRU: enabled via /sys at boot by litric-mm-tune.service (there is no sysctl
# for it).  See usr/lib/systemd/system/litric-mm-tune.service.

# Compaction proactively, cheaply.  Helps THP and large GPU allocations.
vm.compaction_proactiveness = 0

# Leave a reserve so that root can always log in and kill something.
# Reduced from 65536/32768 to save ~96MB on low-RAM targets.
# On a 4GB desktop with MGLRU + zram, the OOM killer activates
# before page allocation failure, so the large reserve is unnecessary.
vm.min_free_kbytes = 8192
vm.admin_reserve_kbytes = 4096
