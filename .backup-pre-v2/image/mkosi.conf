# =============================================================================
# ILTRIC OS — mkosi Image Pipeline Configuration
# Produces: GPT disk image with ESP + system partition
# Output: iltric.raw / iltric.qcow2
# 
# STATUS: DESIGN-ONLY — requires Linux host with mkosi installed
# Prerequisites: systemd-stable ≥ 256, QEMU, mkosi
# =============================================================================

[Distribution]
Distribution=arch
# Rolling release for latest kernel + packages
# Alternative: fedora for more stable base

[Build]
# Use pacman for Arch-based build
PackageManager=arch
# Package directories for Iltric-specific packages
PackageDirectories=../packages

[Output]
# Output image format
Format=disk
# Output filename
ImageId=iltric
# Output directory
OutputDirectory=../build

[EFIBootPartition]
# ESP: 1 GB FAT32 for UKI_A + UKI_B + bootloader
Size=1G
Format=esp
MountPoints=/efi
FsType=vfat

[RootPartition]
# System partition: erofs read-only + dm-verity
Size=4G
Format=erofs
# Verity will be configured separately in build script
MountPoints=/
FsType=erofs
# Read-only rootfs — dm-verity added by build script

[RootVerity]
# dm-verity configuration
Format=plain
Data=

[Tree]
# Root filesystem contents
Packages=
    base
    systemd
    systemd-ukify
    systemd-boot
    linux
    linux-firmware
    mkinitcpio
    mkinitcpio-archiso
    bash
    coreutils
    util-linux
    kmod
    systemd-sysupdate
    systemd-oomd
    zram-generator
    iwd
    systemd-networkd
    systemd-resolved
    wireplumber
    pipewire
    pipewire-pulse
    pipewire-alsa
    mesa
    vulkan-icd-loader
    libdrm
    flatpak
    bubblewrap
    xdg-utils
    xdg-desktop-portal
    dbus
    git
    base-devel
    python
    python-pytest

# Iltric-specific packages (built locally)
# Packages=

[Initrd]
# Include necessary modules for QEMU virtio boot
Modules=
    virtio_pci
    virtio_blk
    virtio_net
    virtio_console
    virtio_gpu
    nvme
    scsi_mod
    sd_mod
    dm_mod
    dm_verity
    btrfs
    erofs
    zram
    overlay

[SecureBoot]
# Use dev keys for now; production keys in boot/keys/
SecureBoot=true
SecureBootAutoEnroll=true

[Qemu]
# QEMU configuration for testing
QemuHeadless=true
QemuKvm=true
# Additional QEMU arguments
QemuArgs=-cpu max -smp 4 -m 4G

